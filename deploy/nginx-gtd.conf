# /etc/nginx/conf.d/gtd.hevosmaa.net.conf  (Rocky Linux / RHEL: conf.d is inside http {})
# Install this as-is, then run:  sudo certbot --nginx -d gtd.hevosmaa.net
# certbot adds the HTTPS server (port 443, certificate lines) and the redirect from http to https.
# Works with the nginx versions Rocky 9 ships (1.20 and later); no http2 directive is needed.

limit_req_zone $binary_remote_addr zone=gtd_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name gtd.hevosmaa.net;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 50m;          # document uploads
    proxy_read_timeout 300s;           # large uploads and slow calendar feeds can take a while

    location = /api/auth/login {
        limit_req zone=gtd_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/snippets/gtd-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/snippets/gtd-proxy.conf;
    }
}
