# /etc/nginx/sites-available/gtd.rikard.me
# Certificates come from certbot (see DEPLOY.md). The first two lines belong in
# the http {} context; putting this file in sites-enabled/ already places them there.

limit_req_zone $binary_remote_addr zone=gtd_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name gtd.rikard.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gtd.rikard.me;

    # certbot fills these in:
    # ssl_certificate     /etc/letsencrypt/live/gtd.rikard.me/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/gtd.rikard.me/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 50m;          # document uploads
    proxy_read_timeout 300s;           # Claude can take a while on big inboxes

    location = /api/auth/login {
        limit_req zone=gtd_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/snippets/gtd-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/snippets/gtd-proxy.conf;
    }
}
