<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <style>
    /* In a browser tab the icon is 16–32px: drop the fine detail and draw what is left heavier. */
    .tab { display: none; }
    @media (max-width: 48px) {
      .fine { display: none; }
      .tab { display: inline; }
    }
  </style>
  <defs>
    <!-- A continuous-corner squircle, as on macOS app icons. -->
    <path id="shape" d="M512 24c-230 0-340 0-414 74S24 282 24 512s0 340 74 414 184 74 414 74 340 0 414-74 74-184 74-414 0-340-74-414S742 24 512 24Z" />
    <clipPath id="sq"><use href="#shape" /></clipPath>
    <clipPath id="in-drop"><use href="#drop-shape" /></clipPath>
    <clipPath id="below"><rect y="604" width="1024" height="420" /></clipPath>
    <!-- Dead calm: pale, cool air that warms a touch toward the horizon. -->
    <linearGradient id="air" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8eff6" />
      <stop offset="0.55" stop-color="#f4f7fa" />
      <stop offset="0.6" stop-color="#fbfcfd" />
    </linearGradient>
    <!-- Water mirrors the sky at a grazing angle near the horizon and deepens toward the viewer. -->
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c4df" />
      <stop offset="0.18" stop-color="#6f97c4" />
      <stop offset="0.6" stop-color="#2d5c96" />
      <stop offset="1" stop-color="#132f57" />
    </linearGradient>
    <linearGradient id="drop" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#b9d8f8" />
      <stop offset="0.45" stop-color="#4b8ae0" />
      <stop offset="1" stop-color="#173f94" />
    </linearGradient>
    <!-- Light gathered in the lower part of the drop, as through a lens. -->
    <radialGradient id="caustic" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e4f1ff" stop-opacity="0.95" />
      <stop offset="1" stop-color="#e4f1ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="spot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d6e7fa" stop-opacity="0.5" />
      <stop offset="1" stop-color="#d6e7fa" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a63bf" stop-opacity="0.55" />
      <stop offset="1" stop-color="#2a63bf" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95" />
      <stop offset="1" stop-color="#fff" stop-opacity="0.1" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="10" /></filter>
    <filter id="softer" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="22" /></filter>
    <path id="drop-shape" d="M512 100c34 80 134 168 134 284a134 134 0 0 1-268 0c0-116 100-204 134-284Z" />
    <!-- Tab size: a fuller drop, since it is most of what shows at 16px. -->
    <path id="drop-tab" d="M512 60c44 100 176 210 176 360a176 176 0 0 1-352 0c0-150 132-260 176-360Z" />
  </defs>

  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#air)" />
    <rect y="604" width="1024" height="420" fill="url(#water)" />
    <!-- A misty horizon, not a ruled line. -->
    <rect class="fine" y="592" width="1024" height="22" fill="#fff" opacity="0.7" filter="url(#soft)" />

    <!-- The drop's reflection, broken up by the rings. -->
    <g class="fine" clip-path="url(#below)">
      <use href="#drop-shape" transform="translate(0 1290) scale(1 -0.6)" fill="url(#reflect)" filter="url(#soft)" opacity="0.8" />
      <ellipse cx="512" cy="770" rx="330" ry="96" fill="url(#spot)" />
    </g>

    <!-- Rings spreading from where the drop will land: a light crest over a darker trough, fading as they widen. -->
    <g class="fine" fill="none" stroke-linecap="round">
      <g stroke="#0c2447">
        <ellipse cx="512" cy="786" rx="92" ry="22" stroke-width="16" opacity="0.35" />
        <ellipse cx="512" cy="792" rx="210" ry="50" stroke-width="14" opacity="0.25" />
        <ellipse cx="512" cy="800" rx="350" ry="84" stroke-width="12" opacity="0.16" />
        <ellipse cx="512" cy="810" rx="500" ry="120" stroke-width="10" opacity="0.1" />
      </g>
      <g stroke="#fff">
        <ellipse cx="512" cy="774" rx="92" ry="22" stroke-width="14" opacity="0.95" />
        <ellipse cx="512" cy="778" rx="210" ry="50" stroke-width="11" opacity="0.62" />
        <ellipse cx="512" cy="784" rx="350" ry="84" stroke-width="8" opacity="0.36" />
        <ellipse cx="512" cy="792" rx="500" ry="120" stroke-width="6" opacity="0.18" />
      </g>
    </g>
    <!-- Tab size: two rings, heavy enough to survive 16px. -->
    <g class="tab" fill="none" stroke="#fff">
      <ellipse cx="512" cy="812" rx="170" ry="46" stroke-width="56" />
      <ellipse cx="512" cy="826" rx="390" ry="108" stroke-width="40" opacity="0.5" />
    </g>

    <!-- The falling drop: glassy, lit from the upper left, light gathering low inside it. -->
    <use class="fine" href="#drop-shape" transform="translate(10 26)" fill="#0c2447" opacity="0.12" filter="url(#softer)" />
    <use class="fine" href="#drop-shape" fill="url(#drop)" />
    <use class="tab" href="#drop-tab" fill="url(#drop)" />
    <g class="fine">
      <g clip-path="url(#in-drop)">
        <!-- Deeper at the right edge, where the glass turns away from the light. -->
        <use href="#drop-shape" transform="translate(-22 -8)" fill="none" stroke="#0b2a66" stroke-width="40" opacity="0.28" filter="url(#soft)" />
        <!-- Light gathered low inside, as through a lens: a crescent, not a spot. -->
        <path d="M424 420c10 62 56 96 100 96s86-30 98-84c-22 34-58 52-98 52s-80-22-100-64Z" fill="url(#caustic)" opacity="0.9" filter="url(#soft)" />
      </g>
      <path d="M440 322c-22 34-31 68-28 106" fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round" opacity="0.88" />
      <circle cx="428" cy="462" r="9" fill="#fff" opacity="0.75" />
    </g>
    <path class="tab" d="M420 300c-30 44-42 90-38 144" fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round" opacity="0.9" />
  </g>
  <!-- A thin light rim, like the glass edge on macOS icons. -->
  <use href="#shape" fill="none" stroke="url(#rim)" stroke-width="6" />
</svg>
