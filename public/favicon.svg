<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- A continuous-corner squircle, as on macOS app icons. -->
    <clipPath id="sq">
      <path d="M512 24c-230 0-340 0-414 74S24 282 24 512s0 340 74 414 184 74 414 74 340 0 414-74 74-184 74-414 0-340-74-414S742 24 512 24Z" />
    </clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fafd" />
      <stop offset="1" stop-color="#c9d9e8" />
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f86c6" />
      <stop offset="0.55" stop-color="#2a5a99" />
      <stop offset="1" stop-color="#15315a" />
    </linearGradient>
    <linearGradient id="drop" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#9cc7f5" />
      <stop offset="0.6" stop-color="#3d7fd9" />
      <stop offset="1" stop-color="#1a50b0" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#9fc6ee" stop-opacity="0.55" />
      <stop offset="1" stop-color="#9fc6ee" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9" />
      <stop offset="1" stop-color="#fff" stop-opacity="0.08" />
    </linearGradient>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#sky)" />
    <rect y="590" width="1024" height="434" fill="url(#lake)" />
    <!-- Light on the surface where the drop lands. -->
    <ellipse cx="512" cy="760" rx="420" ry="150" fill="url(#glow)" />
    <rect y="586" width="1024" height="8" fill="#fff" opacity="0.55" />
    <!-- Rings spreading from the landing point, fading as they widen. -->
    <g fill="none" stroke="#fff">
      <ellipse cx="512" cy="770" rx="110" ry="32" stroke-width="30" opacity="0.95" />
      <ellipse cx="512" cy="770" rx="250" ry="72" stroke-width="24" opacity="0.6" />
      <ellipse cx="512" cy="770" rx="400" ry="116" stroke-width="18" opacity="0.3" />
    </g>
    <!-- The falling drop. -->
    <path d="M512 76c46 98 156 184 156 298a156 156 0 0 1-312 0c0-114 110-200 156-298Z" fill="url(#drop)" />
    <path d="M438 300c-24 34-34 68-31 104" fill="none" stroke="#fff" stroke-width="28" stroke-linecap="round" opacity="0.75" />
  </g>
  <!-- A thin light rim, like the glass edge on macOS icons. -->
  <path d="M512 24c-230 0-340 0-414 74S24 282 24 512s0 340 74 414 184 74 414 74 340 0 414-74 74-184 74-414 0-340-74-414S742 24 512 24Z" fill="none" stroke="url(#rim)" stroke-width="6" />
</svg>
