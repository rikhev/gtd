<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <style>
    /* In a browser tab the icon is 16–32px: two rings, drawn heavier. */
    .tab { display: none; }
    @media (max-width: 48px) {
      .fine { display: none; }
      .tab { display: inline; }
    }
  </style>
  <defs>
    <!-- A continuous-corner squircle, as on macOS app icons. -->
    <path id="shape" d="M512 24c-230 0-340 0-414 74S24 282 24 512s0 340 74 414 184 74 414 74 340 0 414-74 74-184 74-414 0-340-74-414S742 24 512 24Z" />
    <clipPath id="sq"><use href="#shape" /></clipPath>
    <!-- Still water: light at the far edge, deepening toward the viewer. -->
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb2e5" />
      <stop offset="0.5" stop-color="#3a74bb" />
      <stop offset="1" stop-color="#173c73" />
    </linearGradient>
  </defs>

  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#water)" />
    <!-- One touch, and the rings it leaves: fading as they widen, then calm again. -->
    <g class="fine" fill="none" stroke="#fff">
      <ellipse cx="512" cy="530" rx="88" ry="32" stroke-width="24" />
      <ellipse cx="512" cy="530" rx="222" ry="80" stroke-width="17" opacity="0.55" />
      <ellipse cx="512" cy="530" rx="380" ry="137" stroke-width="11" opacity="0.25" />
    </g>
    <g class="tab" fill="none" stroke="#fff">
      <ellipse cx="512" cy="530" rx="170" ry="80" stroke-width="68" />
      <ellipse cx="512" cy="530" rx="400" ry="188" stroke-width="52" opacity="0.5" />
    </g>
  </g>
</svg>
